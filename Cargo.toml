[package]
name = "jellifast"
default-run = "jellifast"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A native Jellyfin music client"
repository = "https://github.com/j4ckxyz/jellifast"
keywords = ["jellyfin", "music", "egui", "player"]
categories = ["multimedia::audio"]

[lib]
name = "jellifast"
path = "src/lib.rs"

[[bin]]
name = "jellifast"
path = "src/jellifast.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# The Jellyfin access token must not be copied into ordinary state JSON.
keyring-core = "1"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client.
# AccessKit connects egui's control names, states, and actions to native screen readers.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
# crmne/fastframe, the foundation crates this app is built on. Every crate comes from the same revision; move them
# together.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Colour emoji in the platform's own style (Apple Color Emoji, Segoe UI
# Emoji, the desktop's colour emoji font), in every text through its egui
# plugin.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Catalogs compiled from PO files at build time (see build.rs) and the
# system's preferred languages. No libintl or runtime catalog parsing.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The log file for bug reports and the panic log (env_logger underneath).
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The tray item, so closing the window can keep the music playing:
# StatusNotifier on Linux, the notification area on Windows, the menu bar
# on macOS.
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Keeps the app running without a window around eframe::run_native.
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The macOS title-bar double-click setting (does nothing elsewhere).
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Self-update from GitHub releases, on the reqwest client below.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1", features = ["reqwest"] }
# The audio device stream: it pauses, so a paused player costs no CPU,
# follows the default output and reopens after a failure.
fastframe-audio = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The wheel step, the Linux touchpad scale and glide, and the axis a scroll
# gesture holds.
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# One running copy per user: a lock and a private channel that a second
# launch and the command line hand their requests to.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The desktop's media controls: MPRIS on Linux, the media overlay on
# Windows, Now Playing on macOS. The media keys and those panels send
# commands back, and closing the window keeps the music playing.
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Reading installed fonts for MilkDrop's overlays, the Winamp playlist's
# pixel text, and the playlist face. skrifa is the parser epaint already
# rasterizes with, and the version has to track epaint's or the binary
# compiles two copies of it; memmap2 keeps the search for the playlist face
# to the few pages of each font that name it. fastframe-fonts uses both.
skrifa = "0.44"
memmap2 = "0.9"
# bmp is for Winamp skins, whose bitmaps are BMP files.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
# Inflating the zip a Winamp skin comes as (src/skin/zip.rs). Already
# compiled for reqwest's gzip support, so this adds no code to the build.
flate2 = "1"
# Filling glyph outlines with no anti-aliasing for the Winamp playlist's
# text (src/ui/winamp/pixel_text.rs). Already compiled for the SVG icons
# through egui_extras and resvg, so this adds no code to the build.
tiny-skia = "0.11"
# MilkDrop, as libprojectM reimplements it, for the MilkDrop window
# (src/milkdrop.rs). Built into the binary, so it stays one file.
projectm-sys = { version = "1.2.2", default-features = false, features = ["static"], optional = true }
# The MilkDrop window runs as a child process with its own winit event loop
# and OpenGL context (src/milkdrop/child.rs), because winit allows one event
# loop per process and eframe owns the app's. These are the same versions
# eframe already pulls in, so they add no build. Only compiled with the
# milkdrop feature.
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
# Detect the live window backend, including when MilkDrop is disabled.
# eframe already compiles this crate.
raw-window-handle = "0.6"
# Decoding what the Jellyfin server streams (src/player.rs): the original
# file when the format is one of these, the server's MP3 transcode otherwise.
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff"] }
# The output's mixer and queue only (src/sink.rs); fastframe-audio owns the
# device stream.
rodio = { version = "0.21", default-features = false }
# `socks` is SOCKS5 proxy support for the Jellyfin server, artwork, lyrics,
# and update checks. HTTP proxies work without it. `system-proxy` reads the OS
# proxy on macOS and Windows when the mode is System; Linux uses environment
# variables either way.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks", "system-proxy"] }
http = "1"
# `fs` is used by the playlist cache in `backend.rs`. On Linux the MPRIS
# dependency happens to turn it on, which is why leaving it out built
# there and nowhere else. `net` is the local HTTP-proxy tests.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# Native asynchronous file selection on macOS, Windows and Linux desktop portals.
rfd = "0.17.2"
rand = "0.9"
open = "5"
percent-encoding = "2"
jiff = "0.2"
unicode-bidi = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# The application menus and Dock menu (src/mac_menu.rs). "exception" lets
# src/mac_touchbar_crash_guard.rs catch a specific AppKit Objective-C
# exception instead of letting it abort the process.
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSScreen", "NSColor", "NSImage", "NSImageView", "NSButton", "NSControl", "NSTrackingArea", "NSVisualEffectView", "NSTextField", "NSBezierPath", "NSFont", "NSAnimation", "NSAnimationContext"] }
# NSAppleEventManager and NSAppleEventDescriptor carry the jellifast: links
# macOS hands an app registered for the scheme (src/mac_links.rs), and
# NSRunLoop has the delayed perform the title bar uses (src/window.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSDictionary", "NSAttributedString", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
# Message loops, the taskbar thumbnail buttons and window styles.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reuses the zbus/Tokio stack already used for desktop integration.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
# The session bus, for the desktop's light or dark preference
# (src/appearance.rs). fastframe-now-playing's MPRIS already compiles this
# version.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Keeps the X11 mini player out of the taskbar with _NET_WM_STATE_SKIP_TASKBAR
# (src/window.rs), which winit only offers on Windows. winit already
# compiles this version.
x11rb = { version = "0.13", default-features = false }

[build-dependencies]
# Drops unfinished PO entries and compiles catalog text and gettext plural
# expressions to Rust. Ordinary builds do not need gettext tools.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1", features = ["build"] }

[dev-dependencies]
# Checks that every catalog covers the template and keeps its placeholders.
polib = "0.3"
# Run connection-deadline regressions with a virtual clock.
tokio = { version = "1", features = ["test-util"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["milkdrop"]
# Sample data and screenshot flags; never part of a release build.
demo = []
# MilkDrop, through libprojectM: a C++ library that CMake builds into the
# binary at compile time, so building needs cmake, a C++ compiler, and
# libclang. `--no-default-features` leaves it out.
milkdrop = ["dep:projectm-sys", "dep:winit", "dep:glutin", "dep:glutin-winit"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2

# projectm-sys names the library it links after Rust's profile (a `d` suffix
# for dev) but CMake names what it builds after the optimisation level, so an
# optimised dev build would look for a library that was never made. A debug
# build of libprojectM is fine to develop against; releases are optimised.
[profile.dev.package.projectm-sys]
opt-level = 0

[patch.crates-io]
# crmne/egui apps-0.36, shared with ZapFast, RekordFlash and TonePush: egui
# 0.36.1 with right-to-left runs shaped in their bidi direction and digits
# shaped left to right in text without right-to-left letters
# (emilk/egui#8577), egui's busy-loop fix (emilk/egui#8398), and eframe pacing
# Wayland frames by the compositor's frame callbacks so a window the
# compositor stops showing never blocks in a vsync swap (emilk/egui#8631,
# #266), each emoji cluster laid out one emoji wide, and egui's clipboard
# sharing its Wayland data device with winit's file drops (#614), accesskit
# focus on a widget drawn a frame later (emilk/egui#8621), a compatibility
# profile when a core GL context fails (emilk/egui#8655), and the zoom factor
# saved with the window size so a zoomed window keeps its size
# (emilk/egui#8656). Every egui
# crate comes from the same revision so they share one emath and epaint.
# Drop this once egui releases these changes.
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), macOS Quit
# through close requests behind a feature Jellifast leaves off (winit#4692),
# a macOS window ordered out and flushed before it closes, so a Touch Bar
# cannot leave a ghost window behind (winit#4728), and file drag and drop on Wayland through the one data device egui's
# clipboard also uses, since Hyprland gives the clipboard and drags only to an
# app's first data device (#614). eframe from the fork above calls the
# Occluded API and shares that device. Move both forks together with the
# other apps.
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
# projectm-sys 1.2.2 hardcodes the Visual Studio 17 2022 CMake generator,
# which GitHub's windows-latest images no longer carry; the fork lets an
# explicit CMAKE_GENERATOR win. Drop when upstream takes the change.
projectm-sys = { git = "https://github.com/crmne/projectm-rs", branch = "respect-cmake-generator" }
