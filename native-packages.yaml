# Shared CLI: gem install native-packages --version 0.8.1
---
schema: 1
tool:
  version: 0.8.1
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the ALSA t64 package name. Override ELF
# inference as well as the explicit dependencies below.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: jellifast
  maintainer: j4ckxyz <j4ckxyz@users.noreply.github.com>
  homepage: https://github.com/j4ckxyz/jellifast
  description: A native music player for Jellyfin
  license: MIT
  contents:
  # A glob source makes nFPM append its basename to the destination directory.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/jellifast"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/jellifast/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/jellifast/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/applications/*.desktop"
    dst: "/usr/share/applications/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/icons/*.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/"
    file_info:
      mode: 420
  - src: contrib/omarchy/jellifast.json.tpl
    dst: /usr/share/jellifast/omarchy/jellifast.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/jellifast-theme
    dst: /usr/share/jellifast/omarchy/jellifast-theme
    file_info:
      mode: 493
  overrides:
    # ELF inspection cannot discover the GUI's dlopen dependencies. Keep
    # these aligned with winit/glutin/rfd and packaging/check-runtime-libs.c.
    deb:
      depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libpulse0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pulseaudio-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'jellifast-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/jellifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: jellifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/jellifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: jellifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: j4ckxyz/jellifast
  prereleases: true
  checksums: checksums.txt
assets:
  AMD64:
    file: jellifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/jellifast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: jellifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/jellifast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: jellifast-v@VERSION@-source.tar.gz
    local: dist/jellifast-v@VERSION@-source.tar.gz
  MACOS:
    file: jellifast-v@VERSION@-macos-universal.dmg
    local: dist/jellifast-v@VERSION@-macos-universal.dmg
templates:
  arch/jellifast/PKGBUILD: packaging/arch/jellifast/PKGBUILD.in
  arch/jellifast/jellifast.install: packaging/arch/jellifast.install
  arch/jellifast-bin/PKGBUILD: packaging/arch/jellifast-bin/PKGBUILD.in
  arch/jellifast-bin/jellifast-bin.install: packaging/arch/jellifast.install
  arch/jellifast-git/PKGBUILD: packaging/arch/jellifast-git/PKGBUILD.in
  arch/jellifast-git/jellifast-git.install: packaging/arch/jellifast.install
  homebrew/jellifast.rb: packaging/homebrew/jellifast.rb.in
repositories:
  aur-source:
    group: aur
    url: https://aur.archlinux.org/jellifast.git
    push_url: ssh://aur@aur.archlinux.org/jellifast.git
    branch: master
    package_path: "."
    files:
      arch/jellifast: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/jellifast-bin.git
    push_url: ssh://aur@aur.archlinux.org/jellifast-bin.git
    branch: master
    package_path: "."
    files:
      arch/jellifast-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/jellifast-git.git
    push_url: ssh://aur@aur.archlinux.org/jellifast-git.git
    branch: master
    package_path: "."
    files:
      arch/jellifast-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  homebrew:
    url: https://github.com/j4ckxyz/homebrew-tap.git
    push_url: https://github.com/j4ckxyz/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/jellifast.rb: Casks/jellifast.rb
    version_file: Casks/jellifast.rb
    version_pattern: version "([^"]+)"
    publish: push
version_file: Cargo.toml
